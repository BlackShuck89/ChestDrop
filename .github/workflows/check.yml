name: Verify and build ChestDrop
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript syntax and run offline tests
        run: |
          node --check background.js
          node --check image-reader.js
          node --check shared.js
          node --check options.js
          node --check popup.js
          node tests/test.js
          node tests/test-options.js
      - name: Check Firefox privacy and data consent manifest
        run: node scripts/check_manifest.js
      - name: Generate mimic artwork icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python scripts/generate_icons.py
      - name: Commit reproducible icons to the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons branding/icon-master-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate mimic PNG resources from source SVG'
            git push
          fi
      - name: Package unsigned Firefox extension
        run: |
          zip -r ChestDrop-unsigned.xpi manifest.json background.js image-reader.js shared.js options.html options.js popup.html popup.js style.css LICENSE icons
      - uses: actions/upload-artifact@v4
        with:
          name: ChestDrop-unsigned
          path: ChestDrop-unsigned.xpi
